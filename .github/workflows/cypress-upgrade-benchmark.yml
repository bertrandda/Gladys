# TEMPORARY: compares the Cypress run of master (Cypress 10.11.0) with the
# upgrade branch (Cypress 16.2.0) on identical runners. Same install and start
# commands as the "Cypress run" job of docker-pr-build.yml, without the
# dependencies cache so every run starts from the same state, and with the
# Cypress output timestamped to measure each spec. To be removed before merging.
name: Cypress upgrade benchmark

on:
  push:
    branches: ['claude/zen-franklin-522ojt']

permissions:
  contents: read

jobs:
  cypress-run:
    name: Cypress ${{ matrix.version }} - run ${{ matrix.run }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        version: [before, after]
        run: [1, 2, 3, 4, 5]
    steps:
      - name: ⬇️ Checkout code
        uses: actions/checkout@v3
        with:
          persist-credentials: false
          # before = master at the base of the branch, after = this branch
          ref: ${{ matrix.version == 'before' && 'a5d8b8c89a46582d5ef6ba817f609d76235063e8' || github.sha }}
      - name: 💽 Setup nodejs
        uses: actions/setup-node@v3
        with:
          node-version-file: 'front/package.json'
      - name: 💽 Install System Dependencies
        run: |
          sudo apt update
          sudo apt-get install -y libudev-dev sqlite3 openssl python-is-python3
      - name: 📦 Install NPM packages
        run: |
          npm ci && npm run install-server:dev
      - name: 🚀 Start server and front
        run: |
          nohup npm run start:cypress > "$RUNNER_TEMP/start.log" 2>&1 &
          # wait for the built front and for the server, so the Cypress run
          # only measures Cypress
          timeout 300 bash -c 'until curl -s -o /dev/null http://localhost:1444 && curl -s -o /dev/null http://localhost:1443; do sleep 1; done'
      - name: ✅ Cypress run
        working-directory: ./front
        run: |
          set -o pipefail
          cat > "$RUNNER_TEMP/stamp.py" <<'EOF'
          import sys, time
          with open(sys.argv[1], 'w') as out:
              for line in sys.stdin:
                  out.write('%.3f\t%s' % (time.time(), line))
                  out.flush()
                  sys.stdout.write(line)
                  sys.stdout.flush()
          EOF
          npm run cypress:run 2>&1 | python3 -u "$RUNNER_TEMP/stamp.py" "$RUNNER_TEMP/cypress.log"
      - name: 📊 Timings
        if: always()
        run: |
          cat > "$RUNNER_TEMP/timings.py" <<'EOF'
          import json, re, sys
          ansi = re.compile(r'\x1b\[[0-9;]*m')
          rows = []
          for raw in open(sys.argv[1], encoding='utf-8', errors='replace'):
              t, _, line = raw.partition('\t')
              rows.append((float(t), ansi.sub('', line.rstrip('\n'))))
          start, end = rows[0][0], rows[-1][0]
          version, specs, current = None, [], None
          for t, line in rows:
              m = re.search(r'│ Cypress:\s+(\S+)', line)
              if m and not version:
                  version = m.group(1)
              m = re.search(r'Running:\s+(\S+\.cy\.js)', line)
              if m:
                  current = {'spec': m.group(1).split('/')[-1], 'start': t}
                  specs.append(current)
              for key in ('Tests', 'Passing', 'Failing'):
                  m = re.search(r'│ %s:\s+(\d+)' % key, line)
                  if m and current:
                      current[key.lower()] = int(m.group(1))
              m = re.search(r'│ Duration:\s+(.+?)\s+│', line)
              if m and current:
                  d = m.group(1)
                  mins = re.search(r'(\d+) minutes?', d)
                  secs = re.search(r'(\d+) seconds?', d)
                  ms = re.search(r'(\d+)ms', d)
                  current['cypress'] = (int(mins.group(1)) * 60 if mins else 0) + (int(secs.group(1)) if secs else 0) + (int(ms.group(1)) / 1000 if ms else 0)
              if 'Run Finished' in line and current:
                  current['end'] = t
          for i, s in enumerate(specs):
              s['wall'] = round((specs[i + 1]['start'] if i + 1 < len(specs) else s.get('end', end)) - s.pop('start'), 1)
              s.pop('end', None)
          out = {'version': version, 'wall': round(end - start, 1), 'specs': specs,
                 'tests': sum(s.get('tests', 0) for s in specs), 'failing': sum(s.get('failing', 0) for s in specs)}
          print(json.dumps(out, indent=1))
          print('::notice title=cypress-benchmark::' + json.dumps(out, separators=(',', ':')))
          EOF
          python3 "$RUNNER_TEMP/timings.py" "$RUNNER_TEMP/cypress.log"
