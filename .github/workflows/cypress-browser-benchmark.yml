# TEMPORARY: compares the Cypress run in Electron and in Chrome (Cypress 16.2.0)
# on identical runners, and validates the CI command (npm run cypress:run, now
# in Chrome) with the same action as docker-pr-build.yml. To be removed before
# merging.
name: Cypress browser benchmark

on:
  push:
    branches: ['claude/zen-franklin-522ojt']

permissions:
  contents: read

jobs:
  cypress-run:
    name: Cypress ${{ matrix.variant }} - run ${{ matrix.run }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        # chrome-http1 = Chrome on the legacy network path of Electron
        # (forceHttp1), to tell the browser from the Cypress 16 native network
        variant: [electron, chrome-http1]
        run: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - name: ⬇️ Checkout code
        uses: actions/checkout@v3
        with:
          persist-credentials: false
      - name: 💽 Setup nodejs
        uses: actions/setup-node@v3
        with:
          node-version-file: 'front/package.json'
      - name: 💽 Install System Dependencies
        run: |
          sudo apt update
          sudo apt-get install -y libudev-dev sqlite3 openssl python-is-python3
      - name: 📦 Install NPM packages
        run: |
          npm ci && npm run install-server:dev
      - name: 🚀 Start server and front
        run: |
          nohup npm run start:cypress > "$RUNNER_TEMP/start.log" 2>&1 &
          # wait for the built front and for the server, so the Cypress run
          # only measures Cypress
          timeout 300 bash -c 'until curl -s -o /dev/null http://localhost:1444 && curl -s -o /dev/null http://localhost:1443; do sleep 1; done'
      - name: ✅ Cypress run
        working-directory: ./front
        run: |
          set -o pipefail
          cat > "$RUNNER_TEMP/stamp.py" <<'EOF'
          import sys, time
          with open(sys.argv[1], 'w') as out:
              for line in sys.stdin:
                  out.write('%.3f\t%s' % (time.time(), line))
                  out.flush()
                  sys.stdout.write(line)
                  sys.stdout.flush()
          EOF
          npx cypress run --config-file cypress/cypress.config.js ${{ matrix.variant == 'electron' && '--browser electron' || '--browser chrome --config forceHttp1=true' }} 2>&1 | python3 -u "$RUNNER_TEMP/stamp.py" "$RUNNER_TEMP/cypress.log"
      - name: 📊 Timings
        if: always()
        run: |
          cat > "$RUNNER_TEMP/timings.py" <<'EOF'
          import json, re, sys
          ansi = re.compile(r'\x1b\[[0-9;]*m')
          rows = []
          for raw in open(sys.argv[1], encoding='utf-8', errors='replace'):
              t, _, line = raw.partition('\t')
              rows.append((float(t), ansi.sub('', line.rstrip('\n'))))
          start, end = rows[0][0], rows[-1][0]
          version, browser, specs, current, naming = None, None, [], None, False
          for t, line in rows:
              m = re.search(r'│ Cypress:\s+(\S+)', line)
              if m and not version:
                  version = m.group(1)
              m = re.search(r'│ Browser:\s+(.+?)\s+│', line)
              if m and not browser:
                  browser = m.group(1)
              # a long spec path is wrapped on the next lines of "Running:"
              if naming:
                  if line.startswith(' ' * 10) and re.fullmatch(r'[\w./-]+', line.strip()):
                      current['spec'] += line.strip()
                      continue
                  current['spec'] = current['spec'].split('/')[-1]
                  naming = False
              m = re.search(r'Running:\s+(\S+)\s+\(\d+ of \d+\)', line)
              if m:
                  current = {'spec': m.group(1), 'start': t}
                  specs.append(current)
                  naming = True
              for key in ('Tests', 'Passing', 'Failing'):
                  m = re.search(r'│ %s:\s+(\d+)' % key, line)
                  if m and current:
                      current[key.lower()] = int(m.group(1))
              m = re.search(r'│ Duration:\s+(.+?)\s+│', line)
              if m and current:
                  d = m.group(1)
                  mins = re.search(r'(\d+) minutes?', d)
                  secs = re.search(r'(\d+) seconds?', d)
                  ms = re.search(r'(\d+)ms', d)
                  current['cypress'] = (int(mins.group(1)) * 60 if mins else 0) + (int(secs.group(1)) if secs else 0) + (int(ms.group(1)) / 1000 if ms else 0)
              if 'Run Finished' in line and current:
                  current['end'] = t
              # keep the failure details printed by mocha before the results box
              if re.match(r'^\s+\d+ failing$', line) and current:
                  current['errors'] = []
              elif '(Results)' in line and current and isinstance(current.get('errors'), list):
                  current['errors'] = ' '.join(' '.join(current['errors']).split())[:1500]
              elif current and isinstance(current.get('errors'), list):
                  current['errors'].append(line.strip())
          startup = round(specs[0]['start'] - start, 1) if specs else None
          for i, s in enumerate(specs):
              s['wall'] = round((specs[i + 1]['start'] if i + 1 < len(specs) else s.get('end', end)) - s.pop('start'), 1)
              s.pop('end', None)
          out = {'version': version, 'browser': browser, 'wall': round(end - start, 1), 'startup': startup, 'specs': specs,
                 'tests': sum(s.get('tests', 0) for s in specs), 'failing': sum(s.get('failing', 0) for s in specs)}
          # annotations are cut at 4096 characters: the failures go in their own
          errors = {s['spec']: s.pop('errors')[:600] for s in specs if s.get('errors')}
          print(json.dumps(out, indent=1))
          print('::notice title=cypress-benchmark::' + json.dumps(out, separators=(',', ':')))
          for spec, error in errors.items():
              print('::notice title=cypress-error::' + json.dumps({'spec': spec, 'error': error}))
          EOF
          python3 "$RUNNER_TEMP/timings.py" "$RUNNER_TEMP/cypress.log"
